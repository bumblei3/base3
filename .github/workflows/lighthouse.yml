name: Lighthouse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pages serviert das Repo unter /base3/, und index.html nutzt absolute
      # /base3/-Pfade (Schriften, Manifest, Service Worker). Wird stattdessen
      # die Wurzel serviert, meldet der Audit 404er bei genau diesen Dateien
      # und wertet sie als Konsolenfehler — gemessen würde eine URL, die es
      # live nicht gibt. Der Symlink legt das Repo unter /base3/ aus.
      - name: Expose repo under /base3/
        run: |
          mkdir -p .lh
          ln -sfn "$PWD" .lh/base3
      - name: Serve site wie Pages
        run: |
          # python3 -m http.server liefert weder gzip noch Cache-Control —
          # Lighthouse hat das ausgewertet: uses-text-compression: 0 und eine
          # Gesamtgröße von 93 KiB, live sind es 44 KiB. Der Audit maß also
          # eine Auslieferung, die die Seite nie benutzt.
          python3 scripts/serve-preview.py --port 8765 --root .lh &
          sleep 2
          curl -sSf http://localhost:8765/base3/ >/dev/null
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:8765/base3/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
