name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy pointer page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Nur ausliefern, was die Seite wirklich referenziert — sonst landen
      # tests/, scripts/ und .github/ unter der Pages-URL.
      # tests/test_pages_deploy.py wacht darüber, dass diese Liste zu den
      # Referenzen in index.html und im Manifest passt.
      - name: Stage deploy files
        run: |
          mkdir -p _site/assets
          cp index.html 404.html robots.txt sitemap.xml og-image.png og-image.webp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png favicon.ico favicon-32.png manifest.webmanifest _site/
          cp -r assets/. _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Ein grüner Deploy beweist nur, dass das Artefakt hochgeladen wurde — nicht,
  # dass die Seite vollständig ist (genau das war schon der Fall: drei
  # referenzierte Dateien fehlten in der Staged-Liste und waren live 404).
  # Der Check vergleicht die ausgelieferten Bytes mit den Repo-Dateien.
  verify:
    name: Verify live deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare live site with repo (SHA-256)
        run: python3 scripts/check-deployed.py
