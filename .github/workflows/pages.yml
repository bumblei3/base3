name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy pointer page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Nur ausliefern, was die Seite wirklich referenziert — sonst landen
      # tests/, scripts/ und .github/ unter der Pages-URL.
      - name: Stage deploy files
        run: |
          mkdir -p _site/assets
          cp index.html robots.txt sitemap.xml og-image.png apple-touch-icon.png manifest.webmanifest _site/
          cp -r assets/. _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
