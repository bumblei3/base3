name: Check version pills (drift guard)

# Prüft, ob index.html / README.md / FAQ.md noch auf dem Stand der
# Nachbar-Repos (schach9x9 + trischach) sind — Versionen, JSON-LD UND die
# „Was ist neu“-Bullets — ohne etwas zu ändern.
# Läuft VOR dem nightly sync-versions (02:00 UTC), damit Drift sichtbar wird;
# ein roter Run hier heißt: der Heiler hat nicht gegriffen (API-Rate-Limit,
# fehlende Rechte) und die Seite zeigt veraltete Pills.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "55 1 * * *"

permissions:
  contents: read

concurrency:
  group: check-sync
  cancel-in-progress: true

jobs:
  check:
    name: Version pills up to date?
    runs-on: ubuntu-latest
    steps:
      # Volle History: _get_base_lastmod() liest das Datum des letzten
      # Commits an index.html/README.md/FAQ.md/sitemap.xml. Bei einem
      # Shallow-Checkout (fetch-depth: 1) hat HEAD keinen Parent, das
      # Pathspec-Log liefert deshalb HEADs Datum → falscher Drift.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run drift check (dry-run, no writes)
        run: |
          python3 scripts/sync-versions.py --check --api-mode \
            --schach-repo-owner bumblei3 --schach-repo-name schach9x9 \
            --trischach-repo-owner bumblei3 --trischach-repo-name trischach
  tests:
    name: Unit tests (sync script)
    runs-on: ubuntu-latest
    steps:
      # Volle History: _get_base_lastmod() liest das Datum des letzten
      # Commits an index.html/README.md/FAQ.md/sitemap.xml. Bei einem
      # Shallow-Checkout (fetch-depth: 1) hat HEAD keinen Parent, das
      # Pathspec-Log liefert deshalb HEADs Datum → falscher Drift.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pillow

      - name: Run tests
        run: python3 -m pytest

      - name: Validate page (tags, JSON-LD, links)
        run: python3 scripts/validate_landing_page.py

      - name: Check WCAG contrast
        run: python3 scripts/check-contrast.py
