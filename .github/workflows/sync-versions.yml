name: Sync version pills from schach9x9 + trischach

on:
  schedule:
    # Jeden Tag Nachts (UTC+2 → 02:00 UTC), damit API-Raten frisch sind
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-versions
  cancel-in-progress: true

jobs:
  sync:
    name: Sync version pills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run version sync
        run: python3 scripts/sync-versions.py --api-mode

      - name: Commit and push if changed
        run: |
          git diff --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html README.md FAQ.md
            git commit -m "chore(base3): sync version pills from schach9x9/trischach (automated)"
            git push
          }
