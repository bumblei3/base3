name: Sync version pills from schach9x9 + trischach

on:
  schedule:
    # Jeden Tag Nachts (UTC+2 → 02:00 UTC), damit API-Raten frisch sind
    - cron: "0 2 * * *"
  push:
    # Direkt nach einem Content-Push, damit der Drift-Wächter (bei 01:55 UTC)
    # nicht dauerhaft rot steht, nur weil index.html/README.md/FAQ.md sich
    # durch den Push geändert haben.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-versions
  cancel-in-progress: true

jobs:
  sync:
    name: Sync version pills
    runs-on: ubuntu-latest
    steps:
      # Volle History: _get_base_lastmod() liest das Datum des letzten
      # Commits an index.html/README.md/FAQ.md/sitemap.xml. Bei einem
      # Shallow-Checkout (fetch-depth: 1) hat HEAD keinen Parent, das
      # Pathspec-Log liefert deshalb HEADs Datum → falscher Drift.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run version sync
        run: |
          python3 scripts/sync-versions.py --api-mode \
            --schach-repo-owner bumblei3 --schach-repo-name schach9x9 \
            --trischach-repo-owner bumblei3 --trischach-repo-name trischach

      # Nach dem Versions-Patch: das FAQPage-JSON-LD wird aus der sichtbaren
      # FAQ-Sektion abgeleitet, also erst danach erzeugen (die Antwort
      # „Welche Versionen sind aktuell?“ enthält die Pills).
      - name: Regenerate FAQPage schema
        run: python3 scripts/sync-faq-schema.py

      - name: Commit and push if changed
        run: |
          git diff --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html README.md FAQ.md sitemap.xml
            git commit -m "chore(base3): sync version pills from schach9x9/trischach (automated)"
            git push
          }
