version: 2
# Wöchentliche, gruppierte Updates für die Actions in .github/workflows/ und
# für die npm-Abhängigkeiten (Playwright, axe-core) der Test-Suite.
# Eine Sammel-PR pro Woche (statt einer PR pro Paket), damit die Rotationsliste
# nicht zumüllt. Geprüft werden die PRs von tests.yml bzw. a11y.yml
# (pull_request-Trigger) — dort laufen pytest, Validator, Nu-HTML-Check und
# die Playwright-Suite.
#
# npm fehlte lange: Playwright und @axe-core/playwright treiben die
# Accessibility- und Offline-Tests, ohne Eintrag drifteten beide still —
# und eine neue Playwright-Version ändert unter Umständen das Browser-Revision
# und damit das Testergebnis.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - dependencies